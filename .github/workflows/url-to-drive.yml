name: Stream Direct URL to Google Drive

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct download URL (e.g. from datanodes)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rclone
        shell: bash
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Stream Directly to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG_DATA }}
          FOLDER_ID: "1-5Y2V5c5Tt2CdvhxCNainyJq0Juta3Pt"
          URL: ${{ inputs.file_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

          # Extract and decode original filename from the URL path
          ORIGINAL_NAME=$(python3 - "$URL" <<'PY'
          import sys, posixpath
          from urllib.parse import urlsplit, unquote

          url = sys.argv[1].strip()
          path = urlsplit(url).path
          name = unquote(posixpath.basename(path))

          if not name:
              name = "downloaded_file"
          print(name)
          PY
          )

          echo "Target filename: $ORIGINAL_NAME"
          echo "Streaming directly to Google Drive..."
          rclone copyurl "$URL" "gdrive:$ORIGINAL_NAME" --drive-root-folder-id "$FOLDER_ID" -P --drive-use-trash=false
          echo "Transfer complete!"
