name: NxNative - IPA Builder

on:
  workflow_dispatch:
    inputs:
      game_zip_url:
        description: "Google Drive URL for the ZIP/RAR containing game files"
        required: true
        type: string
      save_destination:
        description: "Where to save the compiled IPA"
        required: true
        type: choice
        default: "Both"
        options:
          - "Google Drive"
          - "Artifact"
          - "Both"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar glslang rclone
          python3 -m pip install --break-system-packages \
            lz4 capstone fonttools gdown "backports.zstd; python_version < '3.14'"

      - name: Download game ZIP and keys
        env:
          ZIP_URL: ${{ inputs.game_zip_url }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            file_id="$(python3 - "$url" <<'PY'
          import re, sys
          from urllib.parse import urlparse, parse_qs
          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None
          if parsed.netloc.lower() in ("drive.google.com", "www.drive.google.com"):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match: file_id = match.group(1)
              elif query.get("id"): file_id = query["id"][0]
          if not file_id and re.fullmatch(r"[-A-Za-z0-9_]{20,}", url):
              file_id = url
          if not file_id: raise SystemExit("Could not extract Google Drive file ID.")
          print(file_id)
          PY
          )"
            echo "Downloading $(basename "$output")..."
            gdown "$file_id" -O "$output"
            test -s "$output"
          }

          download_file "$ZIP_URL" "$WORK/game.zip"
          download_file "$KEYS_URL" "$WORK/prod.keys"
          chmod 600 "$WORK/prod.keys"

      - name: Extract packages and detect game name
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR" "$WORK/extracted"

          unar -o "$WORK/extracted" "$WORK/game.zip"

          python3 - "$WORK/extracted" "$GAME_DIR" <<'PY'
          import os, re, shutil, sys
          from pathlib import Path

          extract_dir, game_dir = Path(sys.argv[1]), Path(sys.argv[2])
          exts = {".nsp", ".xci", ".nsz", ".xcz"}
          packages = sorted(p for p in extract_dir.rglob("*") if p.is_file() and p.suffix.lower() in exts)

          if not packages:
              raise SystemExit("No valid game packages (.nsp, .xci, .nsz) found in archive.")

          base_name = None
          for pkg in packages:
              target = game_dir / pkg.name
              shutil.move(str(pkg), str(target))
              print(f"Prepared package: {target.name}")
              if not base_name and ("[v0]" in pkg.name.lower() or not re.search(r"\[v[1-9]\d*\]", pkg.name.lower())):
                  base_name = pkg.stem

          if not base_name:
              base_name = packages[0].stem

          clean_name = re.sub(r"\[.*?\]", "", base_name).strip()
          clean_name = re.sub(r"[^\w\- ]", "", clean_name).strip().replace(" ", "-") or "Game"

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"GAME_NAME={clean_name}\n")

          print(f"Identified Base Game Name: {clean_name}")
          PY

      - name: Clean static templates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          exts = {".m", ".h", ".mm", ".c", ".cpp"}
          for p in Path(".").rglob("*"):
              if p.is_file() and p.suffix in exts:
                  try:
                      text = p.read_text(errors="ignore")
                      if "deviceMotionBody" in text or "deviceMotionbody" in text:
                          lines = [l for l in text.splitlines(keepends=True) 
                                   if "deviceMotionBody" not in l and "deviceMotionbody" not in l]
                          p.write_text("".join(lines))
                          print(f"Cleaned template: {p}")
                  except Exception:
                      pass
          PY

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/${GAME_NAME}.ipa"

          (
            while true; do
              find "$RUNNER_TEMP" "$GITHUB_WORKSPACE" -type f -name "DmGamepad.m" 2>/dev/null | while read -r file; do
                if grep -Eq "deviceMotionBody|deviceMotionbody" "$file" 2>/dev/null; then
                  sed -i '' '/deviceMotionBody/d' "$file" 2>/dev/null || true
                  sed -i '' '/deviceMotionbody/d' "$file" 2>/dev/null || true
                  echo "Watchdog patched generated file: $file"
                fi
              done
              sleep 2
            done
          ) &
          WATCHDOG_PID=$!

          trap 'kill $WATCHDOG_PID 2>/dev/null || true' EXIT

          python3 scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT" \
            --allow-other-metal

          kill $WATCHDOG_PID 2>/dev/null || true
          trap - EXIT

          test -s "$OUTPUT"
          echo "IPA created: $OUTPUT"

      - name: Upload IPA to Google Drive
        if: success() && (inputs.save_destination == 'Google Drive' || inputs.save_destination == 'Both')
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG_DATA }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

          OUTPUT="$RUNNER_TEMP/${GAME_NAME}.ipa"
          echo "Uploading $OUTPUT to Google Drive folder..."
          rclone copy "$OUTPUT" "gdrive:" --drive-root-folder-id "$FOLDER_ID" -P --drive-use-trash=false
          echo "Upload complete!"

      - name: Upload IPA to GitHub Artifacts
        if: success() && (inputs.save_destination == 'Artifact' || inputs.save_destination == 'Both')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}
          path: ${{ runner.temp }}/${{ env.GAME_NAME }}.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Clean up temporary files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/nxnative" "$RUNNER_TEMP/GameFiles"
