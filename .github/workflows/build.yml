name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      game_zip_url:
        description: "Google Drive URL for the ZIP/RAR containing all game files (Base, Update, DLC)"
        required: true
        type: string
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout nxnative (Standard version for iPad Pro M1/M-Series)
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 capstone fonttools backports.zstd gdown

      - name: Download game ZIP and keys
        env:
          ZIP_URL: ${{ inputs.game_zip_url }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in (
              "drive.google.com",
              "www.drive.google.com",
          ):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(
              r"[-A-Za-z0-9_]{20,}", url
          ):
              file_id = url

          if not file_id:
              raise SystemExit(
                  "Could not extract a Google Drive file ID."
              )

          print(file_id)
          PY
          )"

            echo "Downloading $(basename "$output")..."
            gdown "$file_id" -O "$output"

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          download_file "$ZIP_URL" "$WORK/game.zip"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          chmod 600 "$WORK/prod.keys"

      - name: Extract game ZIP and prepare packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          echo "Extracting archive..."
          extract_dir="$WORK/extracted"
          mkdir -p "$extract_dir"
          
          unar -o "$extract_dir" "$WORK/game.zip"

          python - "$extract_dir" "$GAME_DIR" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          extract_dir = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }

          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)

              suffix = path.suffix.lower()

              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(f"Invalid {suffix} package signature: {path.name}")

              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(f"Invalid {suffix} package signature: {path.name}")

          packages = sorted(
              p for p in extract_dir.rglob("*")
              if p.is_file() and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No NSP/XCI/NSZ/XCZ packages found inside the extracted archive.")

          print("\n=== Prepared game packages ===")
          for source in packages:
              target = game_dir / source.name

              if target.exists():
                  raise SystemExit("Duplicate package filename: " + source.name)

              validate_package(source)
              shutil.move(str(source), str(target))
              print(f"Added: {target.name} ({target.stat().st_size:,} bytes)")
          PY

          test -s "$WORK/prod.keys"

      - name: Detect game title ID and select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"

          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi

          echo "Detected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Update shader toolchain lock and header
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"

          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"

          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          python "$CHAIN_SCRIPT" --update-lock
          python "$CHAIN_SCRIPT" --header

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-iPadPro
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
