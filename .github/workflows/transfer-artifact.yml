name: Transfer Artifact to Google Drive

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "GitHub Artifact ID to transfer"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Install Google API client
        shell: bash
        run: |
          python3 -m pip install --break-system-packages google-api-python-client google-auth

      - name: Download Artifact from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact_dl"
          
          echo "Downloading artifact $ARTIFACT_ID..."
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/artifact_dl/artifact.zip"
          
          mkdir -p "$RUNNER_TEMP/extracted"
          unzip -q "$RUNNER_TEMP/artifact_dl/artifact.zip" -d "$RUNNER_TEMP/extracted"
          
          IPA_PATH="$(find "$RUNNER_TEMP/extracted" -type f -name "*.ipa" | head -n 1)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::No .ipa file found inside artifact."
            exit 1
          fi
          
          IPA_NAME="$(basename "$IPA_PATH")"
          echo "Found IPA: $IPA_NAME"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA to Google Drive
        env:
          GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds_data = json.loads(os.environ["GDRIVE_CREDS"])
          folder_id = os.environ["FOLDER_ID"].strip()
          file_path = os.environ["IPA_PATH"]
          file_name = os.environ["IPA_NAME"]

          creds = service_account.Credentials.from_service_account_info(
              creds_data, scopes=["https://www.googleapis.com/auth/drive"]
          )
          service = build("drive", "v3", credentials=creds)

          media = MediaFileUpload(file_path, mimetype="application/octet-stream", resumable=True)
          metadata = {"name": file_name, "parents": [folder_id]}

          print(f"Uploading {file_name} to Google Drive...")
          request = service.files().create(body=metadata, media_body=media, fields="id")
          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Uploaded {int(status.progress() * 100)}%")

          print(f"Uploaded successfully! File ID: {response.get('id')}")
          PY
