name: Transfer Artifact to Google Drive

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "GitHub Artifact ID to transfer"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact_dl"
          
          echo "Downloading artifact $ARTIFACT_ID..."
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/artifact_dl/artifact.zip"
          
          mkdir -p "$RUNNER_TEMP/extracted"
          unzip -q "$RUNNER_TEMP/artifact_dl/artifact.zip" -d "$RUNNER_TEMP/extracted"
          
          IPA_PATH="$(find "$RUNNER_TEMP/extracted" -type f -name "*.ipa" | head -n 1)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::No .ipa file found inside artifact."
            exit 1
          fi
          
          IPA_NAME="$(basename "$IPA_PATH")"
          echo "Found IPA: $IPA_NAME"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          filename: ${{ env.IPA_PATH }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: ${{ env.IPA_NAME }}
          overwrite: "true"
